<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Рецептник</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-top">
        <a href="index.html" class="logo">Рецептник</a>
        <nav id="auth-nav" class="auth-nav"></nav>
      </div>
      <p class="tagline">Знайди, що приготувати сьогодні</p>
    </header>

    <main class="container">
      <form id="search-form" class="search">
        <input
          id="search-input"
          type="search"
          placeholder="Пошук за назвою, наприклад «борщ»"
        />
        <button type="submit" class="button">Знайти</button>
      </form>

      <p id="message" class="message" hidden></p>

      <section id="recipes" class="recipes"></section>
    </main>

    <script src="auth.js"></script>
    <script src="app.js"></script>
  </body>
</html>
